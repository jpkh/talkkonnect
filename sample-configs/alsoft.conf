# OpenAL-Soft configuration for Talkkonnect on Raspberry Pi
#
# Deploy to ONE of these locations (first found wins):
#   /etc/openal/alsoft.conf          (system-wide, recommended)
#   ~/.alsoftrc                      (per-user)
#
# PURPOSE:
#   The default ALSA buffer size in OpenAL-Soft is too small for the RPi's
#   timer resolution after long uptime. This causes the mixer thread to log:
#     AL lib: (EE) ALCplaybackAlsa_mixerProc: Wait timeout... buffer size too low?
#   and audio output dies. Increasing buffer-size and period-size prevents the
#   snd_pcm_wait() timeout that triggers this error.
#
# After deploying, restart talkkonnect. No recompilation needed.

[general]
drivers = alsa

[alsa]
device = default
capture = default

# buffer-size: total ALSA PCM ring buffer in frames (samples).
# Keep at default 8192 (≈170 ms at 48 kHz). Do NOT increase — this directly
# adds playback latency, which is unacceptable for PTT radio use.
buffer-size = 8192

# period-size: frames per ALSA period (write chunk size, i.e. interrupt interval).
# THIS is what fixes the Wait timeout on RPi without adding latency.
# The RPi ALSA timer resolution is ~10 ms = 480 frames. When period-size is
# close to or smaller than 480, snd_pcm_wait() has no margin and times out.
# 1024 frames = ~21 ms per period gives safe margin. buffer-size / period-size
# = 8 periods, which is healthy.
period-size = 1024

# mmap = true uses memory-mapped ALSA access. Slightly reduces latency versus
# the default read/write mode. Safe on all standard RPi ALSA drivers.
mmap = true
