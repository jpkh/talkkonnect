# OpenAL-Soft configuration for Talkkonnect on Raspberry Pi
#
# Deploy to ONE of these locations (first found wins):
#   /etc/openal/alsoft.conf          (system-wide, recommended)
#   ~/.alsoftrc                      (per-user)
#
# PURPOSE:
#   Explicit ALSA backend settings for OpenAL-Soft.
#
# NOTE on Sound Blaster Play! 3 + RPi4 (confirmed on multiple units):
#   The USB audio driver for this card already defaults to period_size=1024
#   and caps buffer_size=3072 regardless of what is set here. On that hardware
#   this [alsa] section has no practical effect.
#
#   The 10-hour audio output death (ALCplaybackAlsa_mixerProc: Wait timeout)
#   was caused by ALSA PCM state corruption after accumulated XRUNs — a
#   driver-level hung state that no config change can prevent. The actual fix
#   is the code-level stall detector and ResetStream() in stream.go.
#
#   This file is kept for:
#   a) Documentation of what was investigated
#   b) Other audio hardware where the driver does NOT default to safe values
#
# After deploying, restart talkkonnect. No recompilation needed.

[general]
drivers = alsa

[alsa]
device = default
capture = default

# buffer-size: do NOT increase above 8192 — adds playback latency directly.
# At 48 kHz: 8192 frames = ~170 ms. USB drivers may cap lower (e.g. 3072).
buffer-size = 8192

# period-size: 1024 frames = ~21 ms per period. Gives ALSA timer margin on
# RPi. On Sound Blaster Play! 3 the driver already uses 1024 by default.
period-size = 1024

# mmap = true: memory-mapped ALSA access, slightly lower latency.
mmap = true
